名称: 构建 ImmortalWrt 24.10.6 BBR+Qosify
在:
  推送:
    分支: [ 主 ]
  workflow_dispatch: # 支持手动点击触发编译

职位:
  构建:
    运行于: ubuntu-22.04
    步骤:
      - 名称: 拉取仓库代码
        使用: actions/checkout@v4

      - 名称: 安装编译依赖
        运行: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison openssl libssl-dev \
          dkms libelf-dev libudev-dev libpci-dev libiberty-dev autoconf automake \
          git wget curl rsync unzip python3 python3-pip
          sudo rm -rf /var/lib/apt/lists/*

      - 名称: 克隆ImmortalWrt源码，锁定目标commit
        运行: |
          git clone https://github.com/immortalwrt/immortalwrt.git ./immortalwrt
          cd ./immortalwrt
          git checkout cf234f8de6d5 # 固定和你当前固件一致的commit r33869

      - 名称: 添加插件源 feeds.conf.default
        运行: |
          cd ./immortalwrt
          echo 'src-git tcpbbr https://github.com/chenmozhijin/luci-app-tcpbbr.git' >> feeds.conf.default
          echo 'src-git qosify https://github.com/immortalwrt-collections/openwrt-qosify.git' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - 名称: 预置files目录（BBR sysctl + uci-defaults自动脚本）
        运行: |
          cd ./immortalwrt
          mkdir -p files/etc/sysctl.d
          mkdir -p files/etc/uci-defaults
          # 写入BBR sysctl配置
          cat > files/etc/sysctl.d/99-bbr.conf <
          net.core.default_qdisc=fq
          net.ipv4.tcp_congestion_control=bbr
          EOF
          # 写入首次开机自动配置脚本
          cat > files/etc/uci-defaults/99-custom.sh <
#!/bin/sh
cat > /etc/sysctl.d/99-bbr.conf <
退出 0
net.ipv4.tcp_congestion_control=bbr
CONF
sysctl -p /etc/sysctl.d/99-bbr.conf

WAN_IF=\$(uci get network.wan.ifname)
uci set qosify.@qosify[0].wan="\$WAN_IF"
uci set qosify.@qosify[0].enabled='1'
uci commit qosify
/etc/init.d/qosify enable
/etc/init.d/qosify start
echo "==== BBR已启用，Qosify绑定WAN:\$WAN_IF ====" >> /tmp/init.log
exit 0
EOF
          chmod +x files/etc/uci-defaults/99-custom.sh

      - name: 写入config.seed，预勾选BBR+Qosify全套
        run: |
          cd ./immortalwrt
          cat > config.seed <<EOF
CONFIG_TARGET_x86=y
CONFIG_TARGET_x86_64=y
CONFIG_TARGET_x86_64_DEVICE_generic=y
CONFIG_PACKAGE_kmod-tcp-bbr=y
CONFIG_PACKAGE_kmod-sched-fq=y
CONFIG_PACKAGE_luci-app-tcpbbr=y
CONFIG_PACKAGE_qosify=y
CONFIG_PACKAGE_luci-app-qosify=y
CONFIG_PACKAGE_kmod-sched-bpf=y
CONFIG_PACKAGE_kmod-sched-cake=y
CONFIG_PACKAGE_kmod-ifb=y
CONFIG_PACKAGE_ip-full=y
CONFIG_PACKAGE_tc-tiny=y
CONFIG_PACKAGE_luci-base=y
CONFIG_PACKAGE_luci-theme-bootstrap=y
EOF
          cp config.seed .config
          make defconfig

      - name: 开始编译固件
        run: |
          cd ./immortalwrt
          make -j$(nproc) V=s

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-x86_64-BBR-Qosify
          path: |
            ./immortalwrt/bin/targets/x86/64/*.img.gz
            ./immortalwrt/bin/packages/x86_64/base/*.ipk
          retention-days: 7
